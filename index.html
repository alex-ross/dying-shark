<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dying Shark</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="A Flappy Bird-inspired game where you control a great white shark through underwater obstacles!">
    <meta name="theme-color" content="#1a5490">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dying Shark">
    <meta name="mobile-web-app-capable" content="yes">

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Open Graph -->
    <meta property="og:title" content="Dying Shark">
    <meta property="og:description" content="A Flappy Bird-inspired game where you control a great white shark through underwater obstacles!">
    <meta property="og:type" content="game">
    <meta property="og:image" content="icon-512.png">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas"></canvas>
        <div class="ui-overlay">
            <div class="score-display">
                <div class="current-score">Score: <span id="currentScore">0</span></div>
                <div class="high-score">Best: <span id="highScore">0</span></div>
            </div>
            <div class="game-message" id="gameMessage">
                <h1>Dying Shark</h1>
                <p>Press SPACE, click or tap to swim!</p>
                <button id="startButton">Start Game</button>
            </div>
            <div class="controls">
                <button id="muteButton">🔊</button>
            </div>
        </div>
    </div>
    <script src="audio.js"></script>
    <script src="game.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
